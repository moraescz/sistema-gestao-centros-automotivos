{% extends 'cadastros/base_auth.html' %}
{% load static %}

{% block title %}Senha Redefinida{% endblock %}

{% block content %}
<div class="text-center">
    
    <svg class="h-16 w-16 text-green-400 mx-auto form-field" style="animation-delay: 0.1s;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    
    <h2 class="mt-4 text-3xl font-extrabold text-white form-field" style="animation-delay: 0.2s;">
      Senha redefinida!
    </h2>
    
    <p class="mt-2 text-sm text-gray-300 form-field" style="animation-delay: 0.3s;">
      Sua senha foi alterada com sucesso. Você já pode fazer login.
    </p>

    <div class="mt-8 form-field" style="animation-delay: 0.4s;">
        <a href="{% url 'login' %}" 
        class="group relative w-full flex justify-center py-3 px-4 border border-transparent 
          text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 
          bg-[var(--cor-primaria)] hover:opacity-90 
          transition ease-in-out duration-300 transform hover:scale-[1.02] hover:-translate-y-[1px] text-lg"
          style="background-color: var(--cor-primaria);">
            Fazer login
        </a>
    </div>
</div>
{% endblock %}
