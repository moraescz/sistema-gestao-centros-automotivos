{% extends 'cadastros/base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center">
    <div class="bg-[#424242] text-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h2 class="text-2xl font-semibold mb-4">Confirmar Exclusão</h2>
        <p class="mb-6">Você tem certeza que deseja excluir a Ordem de Serviço <strong class="font-bold">#{{ ordem.pk }}</strong> do veículo <strong class="font-bold">{{ ordem.veiculo.modelo }} ({{ ordem.veiculo.placa }})</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center gap-4">
                <a href="{% url 'listar_ordens_servico' %}" class="px-6 py-2 bg-gray-200 text-gray-800 font-semibold rounded-lg hover:bg-gray-300">Cancelar</a>
                <button type="submit" class="px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700">Excluir</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
