{% extends 'cadastros/base.html' %}

{% block content %}
<h2>Excluir Peça</h2>
<p>Tem certeza que deseja excluir a peça "{{ peca.nome }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar</button>
    <a href="{% url 'listar_pecas' %}">Cancelar</a>
</form>
{% endblock %}
