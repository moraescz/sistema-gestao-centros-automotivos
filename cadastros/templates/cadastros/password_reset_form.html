{% extends 'cadastros/base_auth.html' %} {# Vamos criar este base simples #}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<h2 class="mt-6 text-3xl font-extrabold text-white">Redefinir sua senha</h2>
<p class="mt-2 text-center text-sm text-gray-400">
    Digite seu endereço de e-mail e nós enviaremos instruções para criar uma nova senha.
</p>

<form class="mt-8 space-y-6" method="POST">
    {% csrf_token %}
    <div>
        <label for="email" class="sr-only">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none rounded-md relative block w-full px-3 py-3 border border-gray-700 bg-gray-900 text-white placeholder-gray-500 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Digite seu endereço de e-mail">
    </div>

    <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
            Enviar link de redefinição
        </button>
    </div>
</form>
{% endblock %}
