{% extends 'cadastros/base_auth.html' %}

{% block title %}Senha Alterada{% endblock %}

{% block content %}
<h2 class="mt-6 text-3xl font-extrabold text-white">Senha alterada com sucesso!</h2>
<p class="mt-4 text-center text-md text-gray-300">
    Sua senha foi redefinida. Agora você pode fazer login com sua nova senha.
</p>
<div class="text-center mt-6">
    <a href="{% url 'login' %}" class="font-medium text-blue-400 hover:text-blue-300">
        Fazer Login
    </a>
</div>
{% endblock %}
