{% extends "cadastros/base.html" %}
{% load static %}

{% block content %}
<div class="p-4 sm:p-6 md:p-8 max-w-7xl mx-auto text-white">

    <div class="mb-8">
        <div class="w-fit flex items-center gap-4 border-b-4 border-primary pb-2">
            
            <i class="fas fa-file-upload text-3xl text-primary"></i>
            
            <h1 class="text-3xl sm:text-3xl font-extrabold text-white bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">
                Importar Logs - Anexo
            </h1>
        </div>
    </div>

    <div class="bg-gradient-to-br from-gray-900/90 to-gray-800/90 rounded-3xl shadow-2xl p-8 border border-gray-700/60">

        <form method="post" enctype="multipart/form-data" class="space-y-8">
            {% csrf_token %}

            <label id="dropzone-label" for="file-input" class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-700 border-dashed rounded-xl cursor-pointer bg-gray-800/60 hover:bg-gray-700/60 transition-colors duration-200">
                
                <div id="dropzone-default-text" class="flex flex-col items-center justify-center pt-5 pb-6 text-center">
                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-500 mb-4"></i>
                    <p class="mb-2 text-sm text-gray-400"><span class="font-semibold text-gray-300">Clique para selecionar</span> ou</p>
                    <p class="text-lg font-bold text-gray-300">Arraste e solte o arquivo aqui</p>
                    <p class="text-xs text-gray-500 mt-2">Apenas arquivos .CSV</p>
                </div>
                
                <div id="file-info" class="hidden flex-col items-center justify-center pt-5 pb-6 text-center">
                    <i class="fas fa-file-csv text-6xl text-primary mb-4"></i>
                    <p class="text-lg font-bold text-white" id="file-name">nome-do-arquivo.csv</p>
                    <p class="text-sm text-gray-400">Arquivo pronto para importar!</p>
                    <button id="remove-file-btn" type="button" class="mt-4 text-xs text-red-400 hover:text-red-300 underline font-semibold">
                        Remover arquivo
                    </button>
                </div>
            </label>
            <input id="file-input" type="file" name="csv_file" class="hidden" accept=".csv" required />

            <div class="flex gap-4 pt-6 border-t border-gray-700/50">
                <button id="submit-button" type="submit" 
                        class="bg-primary text-white font-bold py-3 px-8 rounded-xl transform transition-all duration-200 flex items-center gap-2 
                            hover:bg-opacity-80 hover:scale-[1.05] 
                            disabled:opacity-50 disabled:shadow-none disabled:cursor-not-allowed
                            disabled:hover:scale-100 disabled:hover:bg-opacity-100" 
                        disabled>
                    <i class="fas fa-upload"></i>
                    <span>Importar Logs</span>
                </button>
                <a href="{% url 'listar_log_atividades' %}" class="bg-gradient-to-r from-gray-700 to-gray-600 hover:from-gray-600 hover:to-gray-500 text-gray-300 font-semibold py-3 px-8 rounded-xl shadow-md transition-all duration-200 flex items-center gap-2 transform hover:scale-[1.05]">
                    <i class="fas fa-arrow-left"></i>
                    <span>Voltar</span>
                </a>
            </div>
        </form>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('file-input');
    const dropzoneLabel = document.getElementById('dropzone-label');
    const dropzoneDefaultText = document.getElementById('dropzone-default-text');
    const fileInfo = document.getElementById('file-info');
    const fileNameSpan = document.getElementById('file-name');
    const removeFileBtn = document.getElementById('remove-file-btn');
    const submitButton = document.getElementById('submit-button');

    // --- Funções de Manipulação ---

    function handleFile(file) {
        if (file && file.name.endsWith('.csv')) {
            fileNameSpan.textContent = file.name;
            dropzoneDefaultText.classList.add('hidden');
            fileInfo.classList.remove('hidden');
            
            // MELHORIA 3: O Tailwind já cuida das classes 'disabled:'
            // Apenas o atributo 'disabled' precisa ser mudado.
            submitButton.disabled = false;
            
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            fileInput.files = dataTransfer.files;

        } else if (file) {
            alert('Por favor, selecione um arquivo .csv válido.');
            resetFileInput();
        }
    }

    function resetFileInput() {
        fileInput.value = null; 
        dropzoneDefaultText.classList.remove('hidden');
        fileInfo.classList.add('hidden');
        
        // MELHORIA 4: Apenas o atributo 'disabled' precisa ser mudado.
        submitButton.disabled = true;
    }

    // --- Event Listeners de Drag-and-Drop ---
    // (O seu código aqui já estava ótimo)

    dropzoneLabel.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzoneLabel.classList.add('border-blue-500', 'bg-gray-700/70');
    });

    dropzoneLabel.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropzoneLabel.classList.remove('border-blue-500', 'bg-gray-700/70');
    });

    dropzoneLabel.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzoneLabel.classList.remove('border-blue-500', 'bg-gray-700/70');
        
        const file = e.dataTransfer.files[0];
        handleFile(file);
    });

    // --- Event Listener de Clique ---

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        handleFile(file);
    });

    // --- Event Listener do Botão "Remover" ---
    // (O seu código aqui já estava ótimo)

    removeFileBtn.addEventListener('click', (e) => {
        e.preventDefault(); 
        e.stopPropagation();
        resetFileInput();
    });
});
</script>
{% endblock %}
