{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autenticação{% endblock %} - {{ configuracoes.nome_empresa|default:"Centro Automotivo" }}</title>
    <link rel="icon" type="image/png" href="{% if configuracoes.logo and configuracoes.logo.url %}{{ configuracoes.logo.url }}{% else %}{% static 'images/logo.png' %}{% endif %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif;
        }

        :root {
            --cor-primaria: {{ configuracoes.cor_primaria|default:'#0d6efd' }};
            --cor-secundaria: {{ configuracoes.cor_secundaria|default:'#10B981' }};
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .login-card { animation: fadeInUp 0.6s ease-out forwards; }
        .form-field { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }

        .logo-img {
            animation:
                gentleFloat 3s ease-in-out infinite,
                fadeInUp 0.5s ease-out forwards;
            animation-delay: 0s, 0.1s;
        }

        .btn-gradient {
            background: linear-gradient(90deg, var(--cor-secundaria) 0%, var(--cor-primaria) 100%);
            background-size: 200% auto;
            color: white;
            transition: background-position 0.4s ease-in-out, transform 0.2s ease;
        }
        .btn-gradient:hover {
            background-position: right center;
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .form-input-styled {
            border-color: #374151;
            background-color: #1f2937;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input-styled:focus {
            outline: none;
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 2px var(--cor-primaria);
        }
    </style>
    
    {% block extra_styles %}{% endblock %}

</head>

<!-- 🔥 CORRIGIDO: Fundo aplicado NO BODY INTEIRO -->
<body class="min-h-screen flex items-center justify-center relative"
      style="
        background-image: url('{% if configuracoes.imagem_fundo and configuracoes.imagem_fundo.url %}{{ configuracoes.imagem_fundo.url }}{% else %}{% static 'images/fundo site tcc.png' %}{% endif %}');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      ">

    <!-- Overlay global -->
    <div class="absolute inset-0 bg-black opacity-60"></div>

    <!-- 🔥 CORRIGIDO: container do card não limita o fundo -->
    <div class="relative z-10 w-full max-w-md px-4">

        <div class="login-card w-full p-10 bg-gray-900 bg-opacity-80 rounded-2xl shadow-2xl border border-gray-700/50">
            {% block content %}{% endblock %}
        </div>

    </div>

    {% block extra_scripts %}{% endblock %}

</body>
</html>
